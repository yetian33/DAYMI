<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>DAYMI | Redirecionando…</title>
  <meta http-equiv="refresh" content="0; url=/product/" />
  <link rel="canonical" href="/product/" />
  <script>
    (function () {
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var target = '/product/' + (search || '');
      if (hash) {
        target += hash;
      }
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirecionando para <a href="/product/">/product/</a>…</p>
</body>
</html>
